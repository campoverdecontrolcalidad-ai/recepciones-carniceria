<script>
const $=s=>document.querySelector(s);

m:{},get(k){return new Promise(r=>{try{if(!this.db)return r(this.m[k]??null);const q=this.db.transaction('c').objectStore('c').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
set(k,v){return new Promise(r=>{try{if(!this.db){this.m[k]=v;return r()}const t=this.db.transaction('c','readwrite');t.objectStore('c').put(v,k);t.oncomplete=t.onerror=t.onabort=()=>r()}catch(e){this.m[k]=v;r()}})},

const CAMPOS=[['producto','Producto'],['proveedor','Proveedor'],['f_recepcion','Fecha de recepción',fd],['f_faena','Fecha de faena',fd],['temp','Temperatura (°C)',n1],['clasif','Clasificación'],['tipif','Tipificación'],['peso_remito','Peso remito (Kg)',n1],['peso_real','Peso real (Kg)',n1]];
const difs=(a,b)=>CAMPOS.filter(([k,,f])=>f===n1?+a[k]!==+b[k]:String(a[k]??'')!==String(b[k]??'')).map(([k,l,f])=>[l,f?f(a[k]):String(a[k]??'-'),f?f(b[k]):String(b[k]??'-')]);

const qdv=()=>LS('qdv')||[];
const cerrado=f=>{if(!f)return false;const d=new Date(f+'T12:00'),dom=new Date(d);dom.setDate(d.getDate()+(7-d.getDay())%7);const fm=new Date(d.getFullYear(),d.getMonth()+1,0);return dom.toLocaleDateString('en-CA')<today()||fm.toLocaleDateString('en-CA')<today()};

 try{const fotos=l.filter(x=>x.a==='foto'),regs={};l.filter(x=>x.a==='reg').forEach(x=>{regs[x.suc]=[...new Set([...(regs[x.suc]||[]),...x.f])]});

let vw=LS('vw')||(innerWidth<760?'m':'d'),user=JSON.parse(SSt.getItem('u')||'null'),resp=SSt.getItem('r')||'',err='',editId=null,msg='',lastSync='',syncErr=false,syncMsg='',sf={from:'',to:''},flt={from:'',to:'',suc:'',grp:'mes'},kf='',foto=null,fotoErr='',upB=false,drvB=false,drvErr='';

async function upFotos(){if(upB)return;const l=qf();if(!l.length)return;if(!(CONFIG.DRIVE_URL||'').trim())throw new Error('falta configurar DRIVE_URL en config.js');upB=true;
