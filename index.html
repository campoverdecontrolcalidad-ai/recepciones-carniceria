<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const mem={};const st=t=>{try{const x=window[t];x.setItem('_t','1');x.removeItem('_t');return x}catch(e){return{getItem:k=>mem[t+k]??null,setItem:(k,v)=>{mem[t+k]=String(v)},removeItem:k=>{delete mem[t+k]},clear:()=>{}}}};
const LSt=st('localStorage'),SSt=st('sessionStorage');
const LS=(k,v)=>{try{return v===undefined?JSON.parse(LSt.getItem(k)||'null'):LSt.setItem(k,JSON.stringify(v))}catch(e){return v===undefined?null:0}};
const IDB={db:null,open(){return Promise.race([new Promise(r=>{try{const q=indexedDB.open('cv',1);q.onupgradeneeded=()=>q.result.createObjectStore('c');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=q.onblocked=()=>r()}catch(e){r()}}),new Promise(r=>setTimeout(r,1500))])},
m:{},get(k){return new Promise(r=>{try{if(!this.db)return r(this.m[k]??null);const q=this.db.transaction('c').objectStore('c').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
set(k,v){return new Promise(r=>{try{if(!this.db){this.m[k]=v;return r()}const t=this.db.transaction('c','readwrite');t.objectStore('c').put(v,k);t.oncomplete=t.onerror=t.onabort=()=>r()}catch(e){this.m[k]=v;r()}})},
del(k){try{delete this.m[k];this.db&&this.db.transaction('c','readwrite').objectStore('c').delete(k)}catch(e){}}};
let CACHE={},lastFull=0;

const fd=d=>d?d.split('-').reverse().join('/'):'-';
const n1=v=>(+v).toLocaleString('es-AR',{maximumFractionDigits:1});
const SK=(CONFIG.SUPABASE_KEY||'').trim(),B=(CONFIG.SUPABASE_URL||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'')+'/rest/v1',HD={apikey:SK,'Content-Type':'application/json',...(SK.startsWith('eyJ')?{Authorization:'Bearer '+SK}:{})};

function calc(r){const d=r.f_faena?Math.round((new Date(r.f_recepcion)-new Date(r.f_faena))/864e5):null;

  if(q.length){const r=await fetch(B+'/recepciones?on_conflict=id',{method:'POST',headers:{...HD,Prefer:'resolution=merge-duplicates'},body:JSON.stringify(q.map(fullRow))});if(!r.ok)throw new Error('Guardar: '+r.status+' '+(await r.text()).slice(0,140));LS('q',[])}

const tag=r=>`<span class="tag ${r.est}">${{ok:'Conforme',dev:'Desviación',nc:'No conforme'}[r.est]}</span>`;
const yn=b=>`<span class="tag ${b?'nc':'no'}">${b?'SI':'NO'}</span>`;
const ab=r=>`<button type="button" class="btn o s" data-ed="${r.id}">✏️ Editar</button>`;
const fcell=r=>qf().some(x=>x.id===r.id)?'<span class="tag dev">⏳ Pendiente</span>':r.foto_url?`<a href="${esc(r.foto_url)}" target="_blank" rel="noopener">📷 Ver foto</a>`:'<span class="hint">Sin foto</span>';
const hcell=r=>{const h=hist(r);return h.length?`<details><summary>✏️ ${h.length} modificación${h.length>1?'es':''}</summary><div class="hl">${h.map(m=>`<div><b>${fdt(m.t)} · ${esc(m.u)}</b><br>${(m.c||[]).map(c=>`${esc(c[0])}: ${esc(c[1])} → ${esc(c[2])}`).join('<br>')}</div>`).join('')}</div></details>`:'<span class="tag no">Original</span>'};

${l.map(r=>`<tr><td>${esc(r.producto)}</td><td>${fd(r.f_recepcion)}</td><td>${fd(r.f_faena)}</td><td>${n1(r.temp)}</td><td>${esc(r.clasif)}</td><td>${esc(r.tipif)}</td><td>${n1(r.peso_remito)}</td><td>${n1(r.peso_real)}</td><td>${n1(r.dif)}%</td><td>${r.dias===null?'-':`<span class="tag ${r.d4?'nc':'no'}">${r.dias}</span>`}</td><td>${tag(r)}</td><td>${yn(r.dp)}</td><td>${suc?esc(r.sucursal)+' · ':''}${esc(r.responsable)}</td><td>${fcell(r)}</td><td>${hcell(r)}</td>${act?`<td>${ab(r)}</td>`:''}</tr>`).join('')||'<tr><td colspan="16">Sin registros</td></tr>'}</table></div>`}

function viewSuc(){const l=all(),h=l.filter(r=>r.f_recepcion===today()||(r.created_at&&new Date(r.created_at).toLocaleDateString('en-CA')===today())),ed=editId?h.find(r=>r.id===editId):null,oo=ed&&!PROD.includes(ed.producto),oc=ed&&!CLA.includes(ed.clasif),ot=ed&&!TIP.includes(ed.tipif),pfE=ed&&qf().some(x=>x.id===ed.id);if(editId&&!ed)editId=null;
 return head(`${user.n} · Formulario de registro`)+`<main>
 <div class="card"><label>Responsable de la carga *</label><input id="resp" value="${esc(resp)}" placeholder="Nombre y apellido"></div>
 <div class="grid two"><form class="card" id="f"><h2>${ed?'Editar recepción':'Nueva recepción'}</h2>${(()=>{const m=msg;msg='';return m?`<div class="off" style="margin-bottom:12px">${m}</div>`:''})()}<div class="grid">
 <div><label>Producto *</label><select id="prod">${PROD.map(p=>`<option ${ed&&ed.producto===p?'selected':''}>${p}</option>`).join('')}<option value="__o" ${oo?'selected':''}>Otro…</option></select><input id="otro" placeholder="Nombre del producto" value="${oo?esc(ed.producto):''}" style="display:${oo?'block':'none'};margin-top:6px"></div>
 <div><label>Fecha de recepción *</label><input type="date" id="fr" value="${ed?ed.f_recepcion:today()}" required></div>
 <div><label>Fecha de faena (opcional)</label><input type="date" id="ff" value="${ed&&ed.f_faena||''}"><div class="hint">Dejar vacío si no figura en la etiqueta</div></div>
 <div><label>Temperatura (°C) *</label><input type="number" step="0.1" inputmode="decimal" id="t" placeholder="0,0" value="${ed?ed.temp:''}" required><div class="hint">Ideal menor a 7 °C</div></div>
 <div><label>Clasificación *</label><select id="cl">${CLA.map(o=>`<option ${ed&&ed.clasif===o?'selected':''}>${o}</option>`).join('')}<option value="__o" ${oc?'selected':''}>Otro…</option></select><input id="clo" placeholder="Escribí la clasificación" value="${oc?esc(ed.clasif):''}" style="display:${oc?'block':'none'};margin-top:6px"></div>
 <div><label>Tipificación (L/N°) *</label><select id="ti">${TIP.map(o=>`<option ${ed&&ed.tipif===o?'selected':''}>${o}</option>`).join('')}<option value="__o" ${ot?'selected':''}>Otro…</option></select><input id="tio" placeholder="Escribí la tipificación" value="${ot?esc(ed.tipif):''}" style="display:${ot?'block':'none'};margin-top:6px"></div>
 <div><label>Peso remito (Kg) *</label><input type="number" step="0.01" inputmode="decimal" id="pr" value="${ed?ed.peso_remito:''}" required></div>
 <div><label>Peso real (Kg) *</label><input type="number" step="0.01" inputmode="decimal" id="pe" value="${ed?ed.peso_real:''}" required></div>
 <div style="grid-column:1/-1"><label>Foto de la mercadería <span id="fq">${fotoReq(ed?ed.f_recepcion:today())?'*':'(opcional)'}</span></label><div class="ph"><img id="fpv" alt="Vista previa" src="${foto||''}" style="display:${foto?'block':'none'}"><div><input type="file" id="fo" accept="image/*"><div class="hint" id="fh">${foto?'✔ Foto lista':ed&&(ed.foto_url||pfE)?'Este registro ya tiene foto. Subí otra solo si querés reemplazarla.':'Sacá la foto con la cámara o elegila de la galería.'}</div><div class="hint">Obligatoria para recepciones desde el ${fd(FOTO_DESDE)}. Las recepciones anteriores se pueden cargar sin foto.</div></div></div></div></div>
 <br><button class="btn">${ed?'💾 Guardar cambios':'+ Guardar registro'}</button> ${ed?'<button type="button" class="btn o" id="cx">Cancelar</button>':''}<div class="err" id="fe"></div></form>
 <div class="card auto"><h2>Análisis automático</h2><div><span>Desvío T</span><b id="a1">-</b></div><div><span>Días desde faena</span><b id="a2">-</b></div><div><span>Diferencia de peso</span><b id="a3">-</b></div><div><span>Diferencia aceptada (3%)</span><b id="a4">-</b></div><div><span>DP &gt; 3%</span><b id="a5">-</b></div>
 <div class="hint" style="margin-top:12px"><span class="dot" style="background:var(--ok)"></span>T ≤ 7 °C Conforme<br><span class="dot" style="background:var(--dv)"></span>7 &lt; T ≤ 10 °C Desviación<br><span class="dot" style="background:var(--nc)"></span>T &gt; 10 °C No conforme<br>Más de 4 días desde faena → No conformidad</div></div></div>
 <div class="card"><h2>Hoy · ${user.n} <span class="pill" style="background:var(--g)">${h.length}</span></h2><div class="hint" style="margin:-8px 0 12px">Si te equivocaste en una carga, tocá ✏️ Editar. Cada cambio queda registrado con el nombre del responsable.</div>${rows(h,0,1)}</div></main>`}

function bindSuc(){const p=$('#prod'),g=id=>$('#'+id).value;
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editId=b.dataset.ed;foto=null;render();scrollTo(0,0)});
 if($('#cx'))$('#cx').onclick=()=>{editId=null;foto=null;render()};
 p.onchange=()=>$('#otro').style.display=p.value==='__o'?'block':'none';
 [['cl','clo'],['ti','tio']].forEach(([s,i])=>$('#'+s).onchange=()=>$('#'+i).style.display=$('#'+s).value==='__o'?'block':'none');
 $('#fo').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;$('#fh').textContent='Procesando foto…';try{foto=await comprimir(fl);$('#fpv').src=foto;$('#fpv').style.display='block';$('#fh').textContent='✔ Foto lista ('+Math.round(foto.length*.75/1024)+' KB)'}catch(x){foto=null;$('#fh').textContent='⚠ '+x.message}};
 $('#resp').oninput=e=>{resp=e.target.value;SSt.setItem('r',resp)};
 const live=()=>{const t=+g('t'),pr=+g('pr'),pe=+g('pe'),ff=g('ff'),fr=g('fr');
  if(g('t')!==''){const d=Math.max(0,t-7);$('#a1').innerHTML=tag({est:t<=7?'ok':t<=10?'dev':'nc'})+' '+(t>7?'+'+n1(d)+' °C':'')}
  if(ff&&fr){const d=Math.round((new Date(fr)-new Date(ff))/864e5);$('#a2').innerHTML=`<span class="tag ${d>4?'nc':'no'}">${d}</span>`}
  if(pr>0&&g('pe')!==''){const df=pe-pr;$('#a3').textContent=n1(df)+' Kg ('+n1(df/pr*100)+'%)';$('#a4').textContent='±'+n1(pr*.03)+' Kg';$('#a5').innerHTML=yn(Math.abs(df/pr)>.03)}};
 ['t','pr','pe','ff','fr'].forEach(i=>$('#'+i).oninput=live);
 $('#fr').addEventListener('input',()=>{$('#fq').textContent=fotoReq(g('fr'))?'*':'(opcional)'});
 if(editId)live();
 $('#f').onsubmit=async e=>{e.preventDefault();resp=$('#resp').value.trim();SSt.setItem('r',resp);const prod=p.value==='__o'?g('otro').trim():p.value,cl=g('cl')==='__o'?g('clo').trim():g('cl'),ti=g('ti')==='__o'?g('tio').trim():g('ti');
  if(!resp||!prod){$('#fe').textContent='Completá el responsable y el producto';return}
  if(!cl||!ti){$('#fe').textContent='Completá la clasificación y la tipificación (si elegiste "Otro…", escribila)';return}
  if(g('ff')&&g('ff')>g('fr')){$('#fe').textContent='La faena no puede ser posterior a la recepción';return}
  const prev=editId?all().find(x=>x.id===editId):null,pfP=prev&&qf().some(x=>x.id===prev.id);
  if(fotoReq(g('fr'))&&!foto&&!(prev&&(prev.foto_url||pfP))){$('#fe').textContent='Falta la foto de la mercadería (obligatoria desde el '+fd(FOTO_DESDE)+')';return}
  const id=editId||uid(),r={id,sucursal:user.n,responsable:prev?prev.responsable:resp,producto:prod,f_recepcion:g('fr'),f_faena:g('ff')||null,temp:+g('t'),clasif:cl,tipif:ti,peso_remito:+g('pr'),peso_real:+g('pe'),created_at:(prev&&prev.created_at)||new Date().toISOString(),foto_url:prev?prev.foto_url||null:null,historial:prev?hist(prev):[]};
  if(prev){const ch=difs(prev,r);if(foto)ch.push(['Foto',prev.foto_url||pfP?'anterior':'sin foto','reemplazada']);if(!ch.length){msg='No hubo cambios para guardar';editId=null;render();return}r.historial=[...hist(prev),{u:resp,t:new Date().toISOString(),c:ch}]}
  if(foto){const fid=uid();await IDB.set('f_'+fid,foto);qf().filter(x=>x.id===id).forEach(x=>IDB.del('f_'+x.fid));LS('qf',[...qf().filter(x=>x.id!==id),{id,fid,suc:user.n,fecha:r.f_recepcion}]);foto=null}
  LS('q',[...(LS('q')||[]).filter(x=>x.id!==r.id),r]);msg=editId?'Cambios guardados':'Registro guardado';editId=null;sync(true)}}
function comprimir(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.72))};im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('No se pudo leer la imagen. Probá de nuevo.'))};im.src=u})}

// ---------- Calidad ----------
function wk(d){const x=new Date(d+'T00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toLocaleDateString('en-CA')}
function filt(){return all().filter(r=>(!flt.from||r.f_recepcion>=flt.from)&&(!flt.to||r.f_recepcion<=flt.to)&&(!flt.suc||r.sucursal===flt.suc))}
function stats(l){const c={ok:0,dev:0,nc:0};l.forEach(r=>c[r.est]++);const n=l.length||1,p=k=>c[k]/l.length*100||0;
 const dp=l.filter(r=>r.dp).length,d4=l.filter(r=>r.d4).length,prod={};
 l.forEach(r=>{const o=prod[r.producto]??={n:0,rem:0,real:0};o.n++;o.rem+=+r.peso_remito;o.real+=+r.peso_real});
 const per={};l.forEach(r=>{const k=flt.grp==='sem'?'Sem. '+fd(wk(r.f_recepcion)):r.f_recepcion.slice(0,7).split('-').reverse().join('/');
  const o=per[k+'|'+r.producto]??={k,prod:r.producto,n:0,rem:0,real:0};o.n++;o.rem+=+r.peso_remito;o.real+=+r.peso_real});
 const span=l.length?(new Date(Math.max(...l.map(r=>new Date(r.f_recepcion))))-new Date(Math.min(...l.map(r=>new Date(r.f_recepcion)))))/6048e5+1:1;
 return{c,p,dp,d4,prod,per:Object.values(per).sort((a,b)=>b.k.localeCompare(a.k)),avg:l.reduce((s,r)=>s+ +r.temp,0)/n,span:Math.max(1,Math.ceil(span))}}
function donut(c){const t=c.ok+c.dev+c.nc||1,R=80,C=2*Math.PI*R;let o=0;
 return `<svg viewBox="0 0 200 200" width="210">`+[[c.ok,'#3d9a5f'],[c.dev,'#ebb433'],[c.nc,'#d9423e']].map(([v,col])=>{const l=v/t*C,s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="34" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 100 100)"/>`;o+=l;return s}).join('')+`<text x="100" y="108" text-anchor="middle" font-size="26" font-weight="700" fill="#17251c">${c.ok+c.dev+c.nc}</text></svg>`}

const dk=d=>`<td style="font-weight:700;color:${d<-0.05?'#a1241f':d>0.05?'#1d6b3a':'inherit'}">${d>0.05?'+':''}${n1(d)}</td>`;
function ptab(s){const e=Object.entries(s.prod),t=e.reduce((a,[,o])=>({n:a.n+o.n,rem:a.rem+o.rem,real:a.real+o.real}),{n:0,rem:0,real:0});
 return `<div class="tw"><table><tr><th>Producto</th><th>Cant.</th><th>Kg remito</th><th>Kg real</th><th>Dif. kg</th><th title="Cantidad promedio de recepciones por semana">Cant. prom.</th></tr>${e.map(([k,o])=>`<tr><td>${esc(k)}</td><td>${o.n}</td><td>${n1(o.rem)}</td><td>${n1(o.real)}</td>${dk(o.real-o.rem)}<td>${n1(o.n/s.span)}</td></tr>`).join('')||'<tr><td colspan="6">Sin datos</td></tr>'}${e.length?`<tr style="font-weight:700;background:#f1f6f2"><td>Total</td><td>${t.n}</td><td>${n1(t.rem)}</td><td>${n1(t.real)}</td>${dk(t.real-t.rem)}<td>${n1(t.n/s.span)}</td></tr>`:''}</table></div>`}
function sto(){const n=all().length,mb=n*0.4/1024,p=mb/500*100;return `<div class="card"><h2>Espacio de almacenamiento</h2><div style="background:#e8efe9;border-radius:99px;height:12px;overflow:hidden"><div style="width:${Math.min(100,Math.max(p,0.5))}%;height:100%;background:${p>=80?'var(--nc)':p>=60?'var(--dv)':'var(--ok)'}"></div></div><div class="hint" style="margin-top:8px">${n.toLocaleString('es-AR')} registros guardados · uso estimado ${mb<10?mb.toFixed(2):Math.round(mb)} MB de 500 MB (${p<1?'menos del 1':Math.round(p)}%) del plan gratuito. ${p>=80?'⚠ Descargá el Excel de cada sucursal y archivá los registros antiguos.':'Hay espacio de sobra: no hace falta borrar registros.'}</div></div>`}
const KF={ok:['T conforme (≤ 7 °C)','ok',r=>r.est==='ok'],dev:['T en desviación (7 a 10 °C)','dev',r=>r.est==='dev'],nc:['T no conforme (> 10 °C)','nc',r=>r.est==='nc'],dp:['Desvío de peso > 3 %','nc',r=>r.dp],d4:['Más de 4 días desde faena','nc',r=>r.d4]};
function viewCal(){const l=filt(),s=stats(l),f1=v=>n1(v)+'%',N=l.length,pc=v=>n1(v/(N||1)*100)+'%',lt=kf&&KF[kf]?l.filter(KF[kf][2]):l,sn=flt.suc?'Sucursal '+esc(flt.suc):'Todas las sucursales';
 const K=(k,c,lab,val,s1,s2)=>`<div class="card kpi ${c} ${kf&&kf===k?'act':''}" data-kf="${k}" role="button" tabindex="0" title="${k?'Tocá para ver solo estos registros en la tabla de abajo':'Tocá para ver todos los registros'}"><div class="kl">${lab}</div><b>${val}</b><span>${s1}</span><span>${s2}</span></div>`;
 return head('Perfil Calidad · Análisis de todas las sucursales')+`<main>
 <div class="card"><div class="row"><div><label>Fecha de inicio</label><input type="date" id="fi" value="${flt.from}"></div><div><label>Fecha de fin</label><input type="date" id="fe" value="${flt.to}"></div>
 <div><label>Sucursal</label><select id="fs"><option value="">Todas</option>${['Independencia','Paunero','Arenales','San Martín'].map(x=>`<option ${flt.suc===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div style="flex:none"><button class="btn o s" id="pw">Esta semana</button> <button class="btn o s" id="pm">Este mes</button> <button class="btn o s" id="pp">Mes anterior</button> <button class="btn o s" id="pc">Todo</button></div>
 <div style="flex:none"><button class="btn" id="xl">⬇ Descargar Excel</button></div></div><div class="hint">${N} recepciones en el período · el Excel incluye solo lo filtrado (fechas y sucursal) · los porcentajes son sobre el total de recepciones del período</div></div>
 <div class="grid k">${K('','b','Temperatura promedio',n1(s.avg)+' °C','Ideal ≤ 7 °C',N+' recepciones')}
 ${K('ok','','% de entregas con T conforme',pc(s.c.ok),'T ≤ 7 °C · meta ≥ 60%',s.c.ok+' de '+N)}
 ${K('dev','y','% de entregas con T en desviación',pc(s.c.dev),'7 < T ≤ 10 °C · meta ≤ 35%',s.c.dev+' de '+N)}
 ${K('nc','r','% de entregas con T no conforme',pc(s.c.nc),'T > 10 °C · meta ≤ 5%',s.c.nc+' de '+N)}
 ${K('dp','b','% de entregas con desvío de peso > 3%',pc(s.dp),'ideal 0%',s.dp+' de '+N)}
 ${K('d4','b','% de entregas con más de 4 días desde faena',pc(s.d4),'ideal 0%',s.d4+' de '+N)}</div>
 <div class="grid ds"><div class="card"><h2>Distribución de temperaturas</h2><div class="sn">${sn}</div><div class="fx">${donut(s.c)}<div>${[['ok','Conforme','--ok'],['dev','Desviación','--dv'],['nc','No conforme','--nc']].map(([k,n,c])=>`<div class="leg"><span><span class="dot" style="background:var(${c})"></span>${n}</span><b>${s.c[k]} · ${f1(s.p(k))}</b></div>`).join('')}</div></div></div>
 <div class="card"><h2>Cantidad y kg por producto</h2><div class="sn">${sn}</div>${ptab(s)}</div></div>
 
 <div class="card" id="reg"><h2>Registros del período <small style="color:var(--mu);font-weight:400">${kf?lt.length+' de '+N:N+' en total'}</small></h2>${kf&&KF[kf]?`<div class="row" style="align-items:center;margin:-4px 0 12px"><span class="tag ${KF[kf][1]}" style="flex:none">Filtro: ${KF[kf][0]}</span><button type="button" class="btn o s" id="kx" style="flex:none">✕ Quitar filtro</button></div>`:'<div class="hint" style="margin:-8px 0 12px">Tocá un indicador de arriba para ver solo esos registros.</div>'}${rows(lt,1)}</div>${sto()}</main>`}

function bindCal(){const set=(a,b)=>{flt.from=a;flt.to=b;render()};
 $('#fi').onchange=e=>set(e.target.value,flt.to);$('#fe').onchange=e=>set(flt.from,e.target.value);
 $('#fs').onchange=e=>{flt.suc=e.target.value;render()};
 $('#pw').onclick=()=>set(wk(today()),today());$('#pm').onclick=()=>set(today().slice(0,8)+'01',today());$('#pp').onclick=()=>{const d=new Date(),a=new Date(d.getFullYear(),d.getMonth()-1,1),b=new Date(d.getFullYear(),d.getMonth(),0);set(a.toLocaleDateString('en-CA'),b.toLocaleDateString('en-CA'))};$('#pc').onclick=()=>set('','');
 $('#xl').onclick=()=>excel(filt(),flt.suc,flt.from,flt.to);
 document.querySelectorAll('[data-kf]').forEach(c=>c.onclick=c.onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;const k=c.dataset.kf;kf=kf===k?'':k;render();const t=$('#reg');if(kf&&t)t.scrollIntoView({behavior:'smooth',block:'start'})});
 if($('#kx'))$('#kx').onclick=()=>{kf='';render()}}

function excel(l,suc,from,to){if(typeof XLSX==='undefined'){alert('Para descargar el Excel hace falta conexión la primera vez (se guarda para usarlo después sin señal).');return}const s=stats(l),mes=from?fd(from)+' al '+fd(to||today()):'Todos los períodos';
 const H=['Producto','Fecha de recepción','Fecha de elaboración','Temperatura (°C) ideal ≤ 7°C','Clasificación','Tipificación (L/N°)','Peso (Kg)','Peso real (Kg)','Dif. peso (%)','Días faena','Desvío T','DP > 3%','Sucursal','Responsable','Foto (link)','Modificaciones'];
 const E=(n)=>Array(n).fill('');const top=[['CAMPO VERDE',...E(8),'CONTROL DE RECEPCIÓN DE CARNICERÍA',...E(3),'CAR – 0003',''],[...E(14)],[...E(14)]];
 top[0]=['CAMPO VERDE','','','CONTROL DE RECEPCIÓN DE CARNICERÍA',...E(8),'CAR – 0003',''];top[1][12]='Rev: 2.0';top[2][12]='MES: '+mes;
 const ws=XLSX.utils.aoa_to_sheet([...top,['Sucursal','',suc||'Todas','','','Responsable','','Varios',...E(6)],H,
  ...l.map(r=>[r.producto,fd(r.f_recepcion),fd(r.f_faena),+r.temp,r.clasif,r.tipif,+r.peso_remito,+r.peso_real,+r.dif.toFixed(2),r.dias??'',{ok:'Conforme',dev:'Desviación',nc:'No conforme'}[r.est],r.dp?'SI':'NO',r.sucursal,r.responsable,r.foto_url||'',hist(r).map(m=>fdt(m.t)+' '+m.u+': '+(m.c||[]).map(c=>c[0]+' '+c[1]+' → '+c[2]).join('; ')).join(' | ')])]);
 ws['!merges']=[{s:{r:0,c:0},e:{r:2,c:2}},{s:{r:0,c:3},e:{r:2,c:11}},{s:{r:0,c:12},e:{r:0,c:13}},{s:{r:1,c:12},e:{r:1,c:13}},{s:{r:2,c:12},e:{r:2,c:13}},{s:{r:3,c:0},e:{r:3,c:1}},{s:{r:3,c:2},e:{r:3,c:4}},{s:{r:3,c:5},e:{r:3,c:6}},{s:{r:3,c:7},e:{r:3,c:13}}];
 ws['!cols']=[16,16,18,18,20,20,12,14,12,10,14,10,16,20,40,60].map(w=>({wch:w}));
 const f1=v=>+v.toFixed(1),R=[['RESUMEN · '+mes],['Sucursal',suc||'Todas'],[],['Indicador','Valor','Meta'],['Temperatura promedio (°C)',f1(s.avg),'≤ 7'],['% de entregas con T conforme (≤ 7 °C)',f1(s.p('ok')),'≥ 60'],['% de entregas con T en desviación (7 a 10 °C)',f1(s.p('dev')),'≤ 35'],['% de entregas con T no conforme (> 10 °C)',f1(s.p('nc')),'≤ 5'],['% de entregas con desvío de peso > 3%',f1(s.dp/(l.length||1)*100),'0'],['% de entregas con más de 4 días desde faena',f1(s.d4/(l.length||1)*100),'0'],['Total de recepciones',l.length,''],[],
  ['Producto','Cantidad','Kg remito','Kg real','Dif. kg'],...Object.entries(s.prod).map(([k,o])=>[k,o.n,f1(o.rem),f1(o.real),f1(o.real-o.rem)]),[],['Período ('+(flt.grp==='sem'?'semanal':'mensual')+')','Producto','Cantidad','Kg remito','Kg real'],...s.per.map(o=>[o.k,o.prod,o.n,f1(o.rem),f1(o.real)])];
 const w2=XLSX.utils.aoa_to_sheet(R);w2['!cols']=[46,16,14,14,14].map(w=>({wch:w}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');XLSX.utils.book_append_sheet(wb,w2,'Resumen');
 XLSX.writeFile(wb,`CAR-0003_${(suc||'Todas').replace(/\s/g,'')}_${today()}.xlsx`)}
IDB.open().then(async()=>{if(user)CACHE[ck()]=(await IDB.get(ck()))||[];render();if(user)sync()});
